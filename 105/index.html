<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why react</title>
    <style>
        .box{

            height:121px;

            border:2px solid black;
            padding:3px;
        }
    </style>
</head>
<body>
    <script>
        let box1="i am box1";
        let box2="i am box2";
        let box3="i am box3";
    </script>
    <div class="box box1">i am box 1</div>
    <div class="box box2">i am box 2</div>
    <div class="box box3">i am box 3</div>

    <script>
        setTimeout(()=>{
            document.querySelector(".box1").innerHTML="Hey"
        },1000);

         setTimeout(()=>{
            document.querySelector(".box2").innerHTML="Hi"
        },2000);

         setTimeout(()=>{
            document.querySelector(".box3").innerHTML="Hello"
        },3000);
